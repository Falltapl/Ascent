<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ascent — Goals, Certifications & Coursework</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f6fb" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ascent" />
  <script>
      /* Applies the saved theme before first paint. Without this the app
         renders dark for a frame and then snaps to light. */
      (function () {
        try {
          var d = { theme: 'dark', accent: 'violet', motion: 'on' };
          var raw = localStorage.getItem('ascent.theme.v1');
          var s = raw ? Object.assign(d, JSON.parse(raw)) : d;
          if (!raw && window.matchMedia('(prefers-color-scheme: light)').matches) s.theme = 'light';
          var r = document.documentElement;
          r.dataset.theme = s.theme; r.dataset.accent = s.accent; r.dataset.motion = s.motion;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
